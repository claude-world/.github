name: Reusable Python CI
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m pip install -e ".[dev]"
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "No pyproject.toml, setup.py, or requirements.txt found" >&2
            exit 1
          fi
          python -m pip install ruff pytest
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: |
          python -m pytest --tb=short || status=$?
          # pytest exit code 5 means "no tests collected"; anything else non-zero is a failure.
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 5 ]; then exit "$status"; fi
